<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mark's Blog — 生活隨筆與網路資源筆記</title>
  <meta name="description" content="想到什麼說什麼，可能是網路上的免費資源，也可能只是單純的感悟、發牢騷。來自 @mark014blog 的生活記錄。">
  <meta property="og:title" content="Mark's Blog">
  <meta property="og:description" content="想到什麼說什麼・可能是網路上的免費資源・也可能只是單純的感悟、發牢騷">
  <meta property="og:type" content="website">
  <meta property="og:image" content="media/avatar.jpg">
  <meta name="referrer" content="no-referrer">

  <link rel="icon" href="media/avatar.jpg" type="image/jpeg">
  <link rel="alternate" type="application/rss+xml" title="Mark's Blog RSS Feed" href="feed.xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('mark014blog-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="site-shell">
    <!-- Left Identity & Navigation Rail -->
    <aside class="sidebar" id="sidebar" aria-label="頻道介紹與導覽">
      <div class="sidebar-inner">
        <header class="profile-card">
          <div class="profile-top">
            <img
              src="media/avatar.jpg"
              alt="Mark's Blog 頭像"
              class="profile-avatar"
              id="profile-avatar"
              width="60"
              height="60"
              onerror="this.style.display='none'"
            >
            <div class="profile-title-group">
              <h1 class="site-title" id="site-title">Mark's Blog</h1>
              <a
                href="https://t.me/mark014blog"
                target="_blank"
                rel="noopener noreferrer"
                class="channel-handle"
                id="channel-handle"
              >@mark014blog</a>
            </div>
            <button
              type="button"
              class="icon-btn mobile-only"
              id="mobile-filter-toggle"
              aria-expanded="false"
              aria-controls="sidebar-collapsible"
              title="展開導覽"
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
            </button>
          </div>

          <p class="profile-bio" id="profile-bio">
            想到什麼說什麼<br>可能是網路上的免費資源<br>也可能只是單純的感悟、發牢騷
          </p>
        </header>

        <div class="sidebar-collapsible" id="sidebar-collapsible">
          <nav class="nav-section" aria-label="內容分類">
            <div class="filter-list" id="view-filters">
              <button type="button" class="filter-btn active" data-filter="all">
                <span class="filter-label">全部貼文</span>
              </button>
              <button type="button" class="filter-btn" data-filter="original">
                <span class="filter-label">原創隨筆</span>
              </button>
              <button type="button" class="filter-btn" data-filter="gallery">
                <span class="filter-label">相片牆</span>
              </button>
            </div>
          </nav>

          <footer class="sidebar-footer">
            <a
              href="https://t.me/mark014blog"
              target="_blank"
              rel="noopener noreferrer"
              class="primary-cta"
            >
              <span>前往 Telegram 頻道</span>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>
            </a>

            <div class="utility-bar">
              <a href="feed.xml" target="_blank" rel="noopener noreferrer" class="utility-btn" title="RSS 訂閱">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
                <span>RSS</span>
              </a>
              <button type="button" class="utility-btn" id="theme-toggle" aria-label="切換深淺色主題" title="切換深淺色主題">
                <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                <span id="theme-label">深色</span>
              </button>
            </div>
          </footer>
        </div>
      </div>
    </aside>

    <!-- Main Stream -->
    <main class="main-column" id="main-column">
      <div class="toolbar" role="search">
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="搜尋貼文內容…"
            aria-label="搜尋動態內容"
            autocomplete="off"
          >
          <button type="button" class="search-clear" id="search-clear" aria-label="清除搜尋" hidden>×</button>
        </div>

        <div class="toolbar-actions">
          <button type="button" class="tool-pill" id="sort-toggle" title="切換排序順序">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>
            <span id="sort-label">最新</span>
          </button>
        </div>
      </div>

      <div class="active-filter-bar" id="active-filter-bar" hidden>
        <div class="active-filter-text" id="active-filter-text"></div>
        <button type="button" class="clear-filters-btn" id="clear-filters-btn">清除篩選</button>
      </div>

      <div id="feed-container" class="feed-container" aria-live="polite">
        <div class="loading-state">
          <div class="loading-spinner"></div>
          <p>正在載入生活筆記…</p>
        </div>
      </div>

      <div class="load-more-wrap" id="load-more-wrap" hidden>
        <button type="button" class="load-more-btn" id="load-more-btn">載入更多紀錄</button>
      </div>
    </main>
  </div>

  <!-- Back to top button -->
  <button type="button" class="back-to-top" id="back-to-top" aria-label="回到頂部" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
  </button>

  <!-- Photo Lightbox Modal -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="圖片檢視器" hidden>
    <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
    <div class="lightbox-content">
      <button type="button" class="lightbox-close" id="lightbox-close" aria-label="關閉圖片">×</button>
      <button type="button" class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="上一張">‹</button>
      <figure class="lightbox-figure">
        <img id="lightbox-img" src="" alt="放大檢視圖片" referrerpolicy="no-referrer">
        <figcaption class="lightbox-caption" id="lightbox-caption"></figcaption>
      </figure>
      <button type="button" class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="下一張">›</button>
    </div>
  </div>

  <!-- Single Post Reader Modal -->
  <div class="modal" id="post-modal" role="dialog" aria-modal="true" aria-label="單則貼文閱讀" hidden>
    <div class="modal-backdrop" data-close-modal="post-modal"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <span class="modal-title" id="post-modal-title">貼文</span>
        <button type="button" class="modal-close" data-close-modal="post-modal" aria-label="關閉">×</button>
      </div>
      <div class="modal-body" id="post-modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/app.js" defer></script>
</body>
</html>
