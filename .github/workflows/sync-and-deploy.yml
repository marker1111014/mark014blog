name: Sync Telegram & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  repository_dispatch:
    # 方案二主力：由 Telegram Bot + Cloudflare Worker 收到訊息後毫秒級即時觸發
    types: [telegram-update]
  schedule:
    # 每 15 分鐘自動同步一次（錯開整點尖峰降低排隊延遲）
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      full_sync:
        description: "是否重新抓取頻道全部歷史貼文"
        required: false
        default: "false"
        type: boolean
      download_media:
        description: "是否將圖片與貼圖下載備份到倉庫 media/ 目錄"
        required: false
        default: "false"
        type: boolean

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-sync"
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.sync_commit.outputs.should_deploy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Sync Telegram channel (@mark014blog)
        run: |
          SITE_URL="${{ vars.SITE_URL || 'https://blog.markfile.dpdns.org' }}"

          FLAGS=""
          if [ "${{ inputs.full_sync }}" = "true" ]; then
            FLAGS="$FLAGS --full"
          fi
          if [ "${{ inputs.download_media }}" = "true" ]; then
            FLAGS="$FLAGS --download-media"
          fi

          WAIT_ID="${{ github.event.client_payload.message_id || 0 }}"
          if [ "$WAIT_ID" != "0" ]; then
            # 稍微等待 2 秒讓多圖相簿與網頁預覽完成同步
            sleep 2
            FLAGS="$FLAGS --wait-post-id $WAIT_ID"
          fi

          python3 scripts/sync_telegram.py \
            --channel mark014blog \
            --root . \
            --site-url "$SITE_URL" \
            $FLAGS

      - name: Commit updated posts & RSS if changed
        id: sync_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ media/ feed.xml sitemap.xml
          CHANGED="false"
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync @mark014blog posts [skip ci]"
            git pull --rebase origin main || true
            git push
            CHANGED="true"
          else
            echo "No content changes since last sync."
          fi

          if [ "$CHANGED" = "true" ] || [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare static bundle
        if: steps.sync_commit.outputs.should_deploy == 'true'
        run: |
          mkdir -p _site
          cp -r index.html css js data media feed.xml sitemap.xml _site/

      - name: Setup Pages
        if: steps.sync_commit.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: steps.sync_commit.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

  deploy:
    needs: sync-and-build
    if: needs.sync-and-build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 12); do
            COUNT=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || echo "0")
            echo "Attempt $i: found $COUNT github-pages artifact(s)"
            if [ "${COUNT:-0}" -gt 0 ]; then
              sleep 2
              exit 0
            fi
            sleep 3
          done
          echo "::error::Timed out waiting for github-pages artifact to appear in Artifacts API."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
